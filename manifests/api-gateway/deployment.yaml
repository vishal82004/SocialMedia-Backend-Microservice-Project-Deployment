# --- Namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: microservices-prod

---
# --- ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservice-account
  namespace: microservices-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/microservices-irsa-role

---
# --- ConfigMap for Non-Sensitive Environment Variables ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: microservices-prod
data:
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://rabbitmq:5672"
  NODE_ENV: "development"
  CLOUDINARY_CLOUD_NAME: "<YOUR_CLOUDINARY_CLOUD_NAME>"
  CLOUDINARY_API_KEY: "<YOUR_CLOUDINARY_API_KEY>"
  IDENTITY_SERVICE_URL: "http://identity-service:3001"
  POST_SERVICE_URL: "http://post-service:3002"
  MEDIA_SERVICE_URL: "http://media-service:3003"
  SEARCH_SERVICE_URL: "http://search-service:3004"

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: microservices-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: microservice-account

---
# --- External Secrets ---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: microservices-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: microservices
      type: Opaque
      data:
        MONGODB_URI: '{{ .MONGODB_URI }}'
        JWT_SECRET: '{{ .JWT_SECRET }}'
        CLOUDINARY_API_SECRET: '{{ .CLOUDINARY_API_SECRET }}'
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: microservices/app-secrets
        property: MONGODB_URI
    - secretKey: JWT_SECRET
      remoteRef:
        key: microservices/app-secrets
        property: JWT_SECRET
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: microservices/app-secrets
        property: CLOUDINARY_API_SECRET

---
# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices-prod
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: microservice-account
      containers:
      - name: api-gateway
        image: <YOUR_API_GATEWAY_IMAGE>
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: microservices-prod
spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP

